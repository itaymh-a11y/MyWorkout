# Codemagic_Key = שם המפתח ב-Codemagic > Integrations > Developer Portal
# ודא ש-com.itay.myworkout רשום ב-Apple Developer (Identifiers)
workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 90
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Codemagic_Key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.itay.myworkout" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --export-options-plist=/Users/builder/export_options.plist
      - name: Flutter build iOS IPA
        script: |
          cd ios && pod install && cd ..
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist --no-codesign

          # כעת נבצע את ה-export והחתימה האמיתיים באמצעות ה-plist שקודמג'יק יצר
          xcode-project build-ipa --workspace=ios/Runner.xcworkspace --scheme=Runner --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
