workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 90
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
    scripts:
      - name: Flutter build iOS IPA
        script: |
          flutter pub get
          flutter build ipa --release --export-method=app-store
    artifacts:
      - build/ios/ipa/*.ipa
