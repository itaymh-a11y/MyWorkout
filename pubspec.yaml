name: myworkout
description: MyWorkout — מעקב אימונים, תוכניות ותרגילים.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.7
  firebase_auth: ^5.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_logo.png
  web:
    generate: true
    image_path: assets/branding/app_logo.png
    background_color: "#FFFFFF"
    theme_color: "#1565C0"

flutter:
  uses-material-design: true
  assets:
    - assets/seed/builtin_exercises.json
    - assets/branding/app_logo.png
